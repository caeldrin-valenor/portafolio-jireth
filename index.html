<style>

}

    --accent:#7C8CFF; --a2:#C08BFF; --a3:#4A2D9C; --hl:#4A2D9C;
    --dot:rgba(160,140,255,.16); --on-accent:#0E0A22; --warn:#E58A52; --ok:#5CC38F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#130C2B; --panel:#1E1440; --fg:#F2ECFF; --mute:#A99FD6;
  --line:rgba(242,236,255,.2); --line-strong:#F2ECFF; --ink:#7A3CF0;
  --accent:#7C8CFF; --a2:#C08BFF; --a3:#4A2D9C; --hl:#4A2D9C;
  --dot:rgba(160,140,255,.16); --on-accent:#0E0A22; --warn:#E58A52; --ok:#5CC38F; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
#root{height:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}

.screen{--page-display:var(--f-display);--page-body:var(--f-body);min-height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 1px 1px,var(--dot) 1.3px,transparent 1.7px) 0 0/18px 18px,var(--bg);color:var(--fg);position:relative;isolation:isolate}
.screen-bg{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.screen-bg .bgi{position:absolute;inset:0;background-position:center center;background-repeat:no-repeat;background-size:cover;transform-origin:center}
.screen-bg .bgv{position:absolute;inset:0;background:var(--bg);opacity:0;pointer-events:none}
.screen.has-bg::before{display:none!important}
.screen.custom{
  --mute:color-mix(in srgb,var(--fg) 62%,var(--bg));
  --line:color-mix(in srgb,var(--fg) 16%,transparent);
  --line-strong:var(--fg);
  --ink:color-mix(in srgb,var(--fg) 85%,var(--bg));
  --dot:color-mix(in srgb,var(--fg) 10%,transparent);
  --a3:color-mix(in srgb,var(--accent) 30%,var(--bg));
  --hl:color-mix(in srgb,var(--accent) 30%,var(--bg));
  --panel:color-mix(in srgb,var(--fg) 6%,var(--bg));
}
.gut{padding-inline:max(16px,4vw)}

.btn{display:inline-flex;align-items:center;gap:.6em;font:700 12px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;padding:.85em 1.1em;min-height:38px;border:2px solid var(--line-strong);background:var(--bg);color:var(--fg);cursor:pointer;border-radius:0;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s,background .15s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink);background:var(--a3)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.pri{background:linear-gradient(110deg,var(--accent),var(--a2));border-color:var(--line-strong);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.1);background:linear-gradient(110deg,var(--accent),var(--a2));color:var(--on-accent)}
.btn.warn{border-color:var(--warn);color:var(--warn);box-shadow:3px 3px 0 var(--warn)}
.btn.sm{padding:.55em .8em;min-height:32px;font-size:11px;box-shadow:2px 2px 0 var(--ink)}

select,input[type=color]{font:700 11px var(--f-mono);min-height:32px;border:2px solid var(--line-strong);background:var(--bg);color:var(--fg);border-radius:0;padding:.35em .55em;max-width:100%}
input[type=color]{width:38px;padding:2px;cursor:pointer}
input[type=range]{width:100%;max-width:160px;accent-color:var(--accent)}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;padding-block:10px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .crumb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

[contenteditable]{outline:none;cursor:text}
[contenteditable]:hover{box-shadow:0 0 0 1px var(--line-strong)}
[contenteditable]:focus{box-shadow:0 0 0 2px var(--accent)}
[contenteditable][data-ph]:empty::before{content:attr(data-ph);color:var(--mute)}

.cover{position:relative;height:100%;min-height:560px;overflow:hidden}
.cover::before{content:"";position:absolute;inset:0;background:radial-gradient(55% 45% at 50% 46%,color-mix(in srgb,var(--a2) 30%,transparent),transparent 72%),radial-gradient(40% 40% at 10% 92%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%);pointer-events:none}
.cv-stage{position:absolute;inset:0;z-index:1}
.cv-stage canvas{display:block;width:100%;height:100%;pointer-events:none}
.cv-center{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(16px,3.4vh,32px);padding-block:76px 84px;text-align:center;pointer-events:none}
.cv-center>*{pointer-events:auto}
.cv-logo{position:relative;max-width:100%;cursor:pointer;-webkit-user-select:none;user-select:none}
.cv-h{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;margin:0;font-size:clamp(2.6rem,13vw,9.5rem);line-height:1}
.cv-h.plain{font:800 clamp(2.4rem,10vw,8rem)/1 var(--f-display);color:var(--accent);text-shadow:.045em .05em 0 var(--ink);letter-spacing:-.02em;cursor:text;-webkit-user-select:text;user-select:text}
.sp-l{display:inline-block;width:.3em}
.lt{display:inline-block;transform:rotate(var(--r,0deg));animation:bob 3.2s ease-in-out infinite;animation-delay:calc(var(--i,0) * -.28s)}
.lt i{display:block;font-style:normal;line-height:1;padding:.04em .06em;transition:transform .14s ease-out;transform:translateY(var(--ty,0)) scale(var(--sc,1)) rotate(var(--rr,0deg))}
.lt[data-v="0"] i{font:800 1em/1 'Syne',sans-serif;color:var(--accent);text-shadow:.045em .05em 0 var(--ink)}
.lt[data-v="1"] i{font:400 1.06em/1 'Anton',sans-serif;background:var(--fg);color:var(--bg);padding:.02em .1em;box-shadow:.05em .05em 0 var(--a2)}
.lt[data-v="2"] i{font:700 1em/1 'Fraunces',serif;color:var(--bg);-webkit-text-stroke:.03em var(--fg);text-shadow:.05em .05em 0 var(--a2)}
.lt[data-v="3"] i{font:700 1em/1 'Archivo',sans-serif;background:var(--a3);color:var(--fg);padding:.02em .1em;box-shadow:.05em .05em 0 var(--ink)}
.lt[data-v="4"] i{font:800 1em/1 'Syne',sans-serif;color:var(--a2);text-shadow:.045em .05em 0 var(--accent)}
.cv-h.wave .lt i{animation:jump .62s calc(var(--i,0) * 45ms) both}
.cv-y{position:absolute;right:-.2rem;top:-1.7rem;font:700 clamp(.9rem,2.2vw,1.5rem)/1 var(--f-mono);letter-spacing:.06em;padding:.45em .7em;background:var(--a3);color:var(--fg);border:2px solid var(--line-strong);box-shadow:3px 3px 0 var(--ink);transform:rotate(7deg);text-transform:none}
.cv-tag{margin:0;display:inline-block;background:var(--fg);color:var(--bg);padding:.6em 1em;transform:rotate(-1.6deg);box-shadow:4px 4px 0 var(--a2);max-width:100%;overflow-wrap:anywhere}
.btn.big{font-size:14px;padding:1.05em 1.7em;min-height:48px;box-shadow:5px 5px 0 var(--ink)}
.btn.big:hover{animation:wig .5s;box-shadow:7px 7px 0 var(--ink)}
.cv-stk{position:absolute;inset:0;z-index:4;pointer-events:none}
.stk{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));cursor:grab;touch-action:none;pointer-events:auto;-webkit-user-select:none;user-select:none}
.stk svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(3px 4px 0 var(--ink));animation:flt 4.8s ease-in-out infinite;animation-delay:var(--d,0s);transition:scale .15s}
.stk:hover svg{scale:1.1}
.stk.drag{cursor:grabbing;z-index:5}
.stk.drag svg{animation-play-state:paused;scale:1.15}
.stk.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.stk.static{position:relative;transform:rotate(var(--r,0deg));cursor:default;pointer-events:none;display:inline-block;flex:none}
.stk-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pt{position:absolute;width:14px;height:14px;z-index:6;pointer-events:none;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.cv-foot{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;padding-block:12px 14px;color:var(--mute);pointer-events:none}

@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -.07em}}

@keyframes jump{0%{transform:translateY(0) scale(1) rotate(0)}35%{transform:translateY(-.4em) scale(1.3) rotate(-10deg)}100%{transform:translateY(0) scale(1) rotate(0)}}

.cv-item{position:relative;max-width:100%}
.cv-item.cv-edit{padding:6px 8px;border:2px dashed color-mix(in srgb,var(--accent) 65%,transparent);cursor:grab;touch-action:none;background:color-mix(in srgb,var(--bg) 55%,transparent)}
.cv-item.cv-edit.dragging{cursor:grabbing}

.cv-reset{position:absolute;right:16px;bottom:64px;z-index:9;display:flex;gap:8px}

.menu{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,6vw,88px);padding-block:clamp(28px,6vw,72px);width:100%;max-width:1240px;margin-inline:auto;flex:1}
.prof{display:flex;flex-direction:column;gap:16px;min-width:0}

.idx{display:flex;flex-direction:column;min-width:0}

.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:2px solid var(--line-strong);padding:clamp(14px,2.4vw,24px) 6px;cursor:pointer;color:var(--fg);transition:padding .2s,background .2s,color .2s,transform .2s}
.row:hover{background:linear-gradient(100deg,var(--accent),var(--a2));color:var(--on-accent);padding-left:18px;transform:rotate(-.6deg)}
.row:hover .row-m{color:inherit;opacity:.85}
.row-t{font:700 clamp(1.5rem,3.6vw,2.4rem)/1.1 var(--f-display);letter-spacing:-.02em;overflow-wrap:anywhere}
.row-m{grid-column:1;color:var(--mute)}

.row-edit{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-bottom:1px solid var(--line)}

.page-body{width:100%;max-width:1000px;margin-inline:auto;padding-block:clamp(24px,5vw,56px);display:flex;flex-direction:column;gap:clamp(18px,3vw,32px);flex:1;font-family:var(--page-body)}
.b-h{margin:0;width:fit-content;max-width:100%;font:800 clamp(1.9rem,6.5vw,3.4rem)/1.08 var(--page-display);letter-spacing:-.03em;text-wrap:balance;overflow-wrap:anywhere;background:linear-gradient(transparent 62%,var(--hl) 62% 94%,transparent 94%)}
.b-p{margin:0;font-size:1.08rem;line-height:1.65;max-width:68ch;white-space:pre-wrap;font-family:var(--page-body);overflow-wrap:anywhere}
.sp{width:100%}
.sp.line{border-top:1px solid var(--line-strong);height:0!important;margin-block:var(--sp,24px)}
.mg{display:grid;grid-template-columns:repeat(var(--c,1),minmax(0,1fr));gap:20px}
.mg.pres{gap:0}
.mg.pres .mi{margin:0 0 clamp(20px,4vw,40px) 0}

.mi{margin:0;min-width:0;position:relative;display:flex;flex-direction:column;gap:6px}

.pnav{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;border-top:1px solid var(--line);padding-block:20px 28px;margin-top:8px}
.pnav .btn{max-width:100%}

.panel{position:relative;z-index:15;border:2px solid var(--line-strong);background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:5px 5px 0 var(--ink)}
.gpanel .panel{position:static;z-index:auto}
.panel h3{margin:0;font:700 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.fields{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:5px;color:var(--mute)}
.bframe{border:2px dashed var(--line-strong);min-width:0}

.adder>span{color:var(--mute);margin-right:4px}

.mv{position:relative;aspect-ratio:16/10;min-height:340px;max-width:100%;background:var(--panel);border:2px solid var(--line-strong);box-shadow:6px 6px 0 var(--ink);overflow:hidden}
.mv-stage{position:absolute;inset:0}
.mv-stage canvas{display:block;width:100%;height:100%;cursor:grab}
.mv-stage canvas:active{cursor:grabbing}
.mv-top,.mv-bot{position:absolute;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none;z-index:2}
.mv-top{top:10px;justify-content:space-between;align-items:flex-start}
.mv-bot{bottom:10px;align-items:center}
.mv-top>*,.mv-bot>*{pointer-events:auto}
.mv-modes{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:700 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:.6em .8em;min-height:32px;border:2px solid var(--line-strong);background:color-mix(in srgb,var(--bg) 85%,transparent);color:var(--fg);cursor:pointer;border-radius:0}
.chip:hover{background:var(--a3);color:var(--fg)}

.chip.static{cursor:default;pointer-events:none;color:var(--mute);display:inline-flex;align-items:center}
.mv-msg{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);text-align:center;color:var(--mute);z-index:1;pointer-events:none;text-wrap:balance}
.mv-cap{margin-top:8px}

.yt-box{position:relative;background:#000;aspect-ratio:16/9}
.yt-box img{display:block;width:100%;height:100%;object-fit:cover}
.yt-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

.yt-play:hover{background:rgba(0,0,0,.32)}

.yt-play:hover svg{transform:scale(1.08)}

.yt-url{flex:1 1 220px;min-width:180px;font:500 12px/1 var(--f-mono);padding:.5em .6em;border:2px solid var(--line-strong);background:var(--bg);color:var(--fg);min-height:32px}

.tex-workspace{display:grid;grid-template-columns:minmax(220px,280px) minmax(0,1fr);gap:16px;align-items:start}

.tex-row:hover{background:var(--a3)}

maciones","style":{},"blocks":[{"id":"y4591ut","type":"h","text":"Animaciones","align":"center","size":1.5},{"id":"zkcnm66","type":"h","text":"                                Mascota Ferrero"},{"id":"pwkv4c2","type":"youtube","url":"https://youtu.be/8NCIqpOKL0Q","vid":"8NCIqpOKL0Q","cap":"","ratio":"16/9"},{"id":"uzv714a","type":"p","text":"Cicco es una pequeña ardillita creada como mascota de Ferrero para una actividad de diseño de personajes y creación de un comercial. En esta animación, Chicco presenta y descubre algunos de los diferentes productos de la marca de una manera divertida y dinámica. Su nombre está inspirado en la palabra chocolate en italiano, reflejando su conexión con el dulce mundo de Ferrero."},{"id":"crdv90q","type":"h","text":"ROBI"},{"id":"5mx2zlg","type":"youtube","url":"https://youtu.be/zinOEJu8cBk","vid":"zinOEJu8cBk","cap":"","ratio":"16/9"},{"id":"6d9655w","type":"p","text":"La animación Roby cuenta la historia de una hiena que atraviesa una situación de explotación laboral y maltrato verbal, lo que la lleva a experimentar una fuerte frustración. A través de esta historia, busqué representar cómo la dificultad para gestionar las emociones puede afectar nuestra manera de actuar y de reaccionar ante situaciones difíciles. Este proyecto busca transmitir la importancia del autocontrol y de reconocer nuestras emociones, mostrando cómo la frustración puede influir en nuestras decisiones cuando nos dejamos llevar por ella."},{"id":"1iv23kj","type":"h","text":"STARFIRE"},{"id":"jcoo6kl","type":"youtube","url":"https://youtube.com/shorts/u6pTETEk8Ds?feature=share","vid":"u6pTETEk8Ds","cap":"","ratio":"16/9"},{"id":"yo47lrx","type":"p","text":"Esta animación está inspirada en Starfire, uno de los personajes del universo de DC Comics. En ella se muestran algunos de los diferentes outfits que ha tenido el personaje a lo largo de sus distintas apariciones en los cómics, destacando la evolución de su diseño y los cambios en su estilo visual.\nEste proyecto busca explorar la variedad estética del personaje y mostrar cómo su apariencia se ha transformado a lo largo del tiempo, manteniendo su esencia y personalidad."},{"id":"2imh5wn","type":"h","text":"LA HIJA DEL MAL"},{"id":"hrfbd95","type":"youtube","url":"https://youtu.be/k4w5UrBjfYg","vid":"k4w5UrBjfYg","cap":"","ratio":"16/9"},{"id":"hjbd8bx","type":"p","text":"Esta pequeña animación está inspirada en La hija del mal, una de las canciones de la saga Evilious Chronicles, interpretada por los Vocaloid Rin y Len Kagamine.\nEn esta animación quise representar a los dos personajes principales de la historia: la princesa y su sirviente, tomando como referencia la narrativa y la estética de esta canción, que cuenta una historia llena de misterio, drama y tragedia.\nEste proyecto es una forma de expresar mi gusto por las historias narrativas y explorar cómo la animación puede dar vida a personajes y momentos inspirados en la música."}],"worlds":[]},{"id":"h1v8qpe","title":"Render","style":{},"blocks":[{"id":"a3t4r4q","type":"h","text":"Render"},{"id":"71vwnsm","type":"media","items":[{"id":"rq6nidi-Untitled.png","kind":"image","name":"Untitled.png","cap":""}],"cols":1,"ratio":"auto","fit":"cover","pres":true},{"id":"63zk8ny","type":"media","items":[{"id":"lwcb345-Untitled1.png","kind":"image","name":"Untitled1.png","cap":""},{"id":"avn7d2y-Untitled14png.png","kind":"image","name":"Untitled14png.png","cap":""}],"cols":2,"ratio":"auto","fit":"cover","pres":false},{"id":"9dxr89j","type":"p","text":"Aurora"},{"id":"g93pcrc","type":"media","items":[{"id":"15br1w8-Untitled1.png","kind":"image","name":"Untitled1.png","cap":""}],"cols":1,"ratio":"auto","fit":"cover","pres":true},{"id":"6du1j8o","type":"media","items":[{"id":"5y2og9k-Untitled.png","kind":"image","name":"Untitled.png","cap":""},{"id":"m34i2xo-Untitled2.png","kind":"image","name":"Untitled2.png","cap":""}],"cols":2,"ratio":"auto","fit":"cover","pres":false},{"id":"gbuxw3w","type":"p","text":"Ciocco"},{"id":"a0ix const IDB_NAME='pf-assets', IDB_STORE='blobs', IDB_VER=1;
let _idbP=null;
function idb(){
  if(_idbP) return _idbP;
  _idbP=new Promise((res,rej)=>{
    if(!window.indexedDB) return rej(new Error('IndexedDB no disponible'));
    const req=indexedDB.open(IDB_NAME,IDB_VER);
    req.onupgradeneeded=()=>{ const d=req.result; if(!d.objectStoreNames.contains(IDB_STORE)) d.createObjectStore(IDB_STORE); };
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  });
  return _idbP;
}
function idbPut(id,blob){
  return idb().then(d=>new Promise((res,rej)=>{
    const tx=d.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(blob,id);
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
  }));
}
function idbGet(id){
  return idb().then(d=>new Promise((res,rej)=>{
    const tx=d.transaction(IDB_STORE,'readonly');
    const rq=tx.objectStore(IDB_STORE).get(id);
    rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error);
  }));
}
function idbDel(id){
  return idb().then(d=>new Promise((res,rej)=>{
    const tx=d.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
  })).catch(()=>{});
}

const memAssets={
  files:{},
  _urls:new Map(),
  _subs:{},
  _loading:{},
  async upload(file){
    const id=uid()+'-'+file.name.replace(/[^\w.-]/g,'_');
    try{ await idbPut(id,file); }
    catch(e){ console.warn('No se pudo persistir el archivo en IndexedDB:',e); }
    const url=URL.createObjectURL(file);
    this.files[id]={url, blob:file};
    this._urls.set(id,url);
    return {id};
  },
  async delete(id){
    if(this.files[id]){
      try{ URL.revokeObjectURL(this.files[id].url); }catch(e){}
      delete this.files[id];
    }
    this._urls.delete(id);
    await idbDel(id);
  },
  url(id){
    if(this._urls.has(id)) return this._urls.get(id);
    if(this.files[id]) return this.files[id].url;
    this._load(id);
    return '';
  },
  async _load(id){
    if(this._urls.has(id)) return this._urls.get(id);
    if(this.files[id]) return this.files[id].url;
    if(this._loading[id]) return this._loading[id];
    this._loading[id]=(async()=>{
      try{
        const blob=await idbGet(id);
        if(!blob) return null;
        const url=URL.createObjectURL(blob);
        this.files[id]={url, blob};
        this._urls.set(id,url);
        this._emit(id,url);
        return url;
      }catch(e){ return null; }
      finally{ delete this._loading[id]; }
    })();
    return this._loading[id];
  },
  onReady(id,fn){
    if(this._urls.has(id)) return fn(this._urls.get(id));
    (this._subs[id]=this._subs[id]||[]).push(fn);
  },
  _emit(id,url){
    const s=this._subs[id]||[];
    s.forEach(fn=>{try{fn(url);}catch(e){}});
    delete this._subs[id];
  },
  async preload(ids){
    await Promise.all(ids.map(id=>this._load(id)));
  }
};

const SNAP_MARK='/*__SNAP'+'SHOT__*/null';
function collectCandidates(o,set){
  if(typeof o==='string'){ if(/^[\w.\-]{6,200}$/.test(o)&&o!=='demo') set.add(o); }
  else if(Array.isArray(o)) o.forEach(x=>collectCandidates(x,set));
  else if(o&&typeof o==='object') Object.keys(o).forEach(k=>collectCandidates(o[k],set));
  return set;
}
async function getAssetBlob(id){
  try{ const u=await memAssets._load(id); if(u&&memAssets.files[id]&&memAssets.files[id].blob) return memAssets.files[id].blob; }catch(e){}
  try{ if(assets&&assets.files&&assets.files[id]&&assets.files[id].blob) return assets.files[id].blob; }catch(e){}
  try{
    const u=await assetURLAsync(id);
    if(u){ const r=await fetch(u); if(r.ok){ const ct=r.headers.get('content-type')||''; if(!/text\/html/i.test(ct)) return await r.blob(); } }
  }catch(e){}
  return null;
}
function blobToB64(b){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=()=>rej(r.error); r.readAsDataURL(b); });
}
async function exportPublic(){
  if(SNAPSHOT) return;
  try{
    await flush();
    toast('Preparando la versión pública… puede tardar un poco',6000);
    const ids=[...collectCandidates(S,new Set())];
    const out={}; let total=0, n=0;
    for(const id of ids){
      const b=await getAssetBlob(id);
      if(!b||!b.size) continue;
      const d=await blobToB64(b);
      out[id]={t:b.type||'application/octet-stream',d};
      total+=d.length; n++;
    }
    const snap={state:JSON.parse(JSON.stringify(S)),assets:out};
    const json=JSON.stringify(snap).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
    const main=document.getElementById('pf-main').textContent;
    const k=main.indexOf(SNAP_MARK);
    if(k<0) throw new Error('No se encontró el punto de inserción');
    const script=main.slice(0,k)+json+main.slice(k+SNAP_MARK.length);
    const styles=[...document.querySelectorAll('style')].map(x=>x.outerHTML).join('\n');
    const libs=[...document.querySelectorAll('script[src^="https://cdn"]')].map(x=>'<script src="'+x.getAttribute('src')+'"><\/script>').join('\n');
    const html='<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>'+(S.title||'Portafolio')+' '+(S.year||'')+'</title>\n'+styles+'\n</head><body><div id="root"></div>\n'+libs+'\n<script id="pf-main">\n'+script+'\n<\/script></body></html>';
    const blob=new Blob([html],{type:'text/html'});
    const mb=(blob.size/1048576).toFixed(1);
    const fname='Portafolio_PUBLICO_solo_lectura.html';
    let dl=null; try{ if(window.claude&&window.claude.use) dl=await window.claude.use('downloads'); }catch(e){}
    if(dl){ await dl.save({filename:fname,data:blob}); }
    else{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000); }
    toast('Versión pública lista ('+mb+' MB, '+n+' archivos incluidos)'+(blob.size>15.5*1048576?' — ⚠ pesa más de 16 MB, comprime modelos/texturas para poder publicarla':''),9000);
  }catch(e){
    if(e&&e.code==='declined') return;
    console.warn(e); toast('No se pudo crear la versión pública: '+((e&&e.message)||'error'),6000);
  }
}
async function loadSnapshot(){
  const A=SNAPSHOT.assets||{};
  for(const id of Object.keys(A)){
    // Versión optimizada: el archivo está en la carpeta assets y se carga solo cuando se necesita.
    if(A[id].u){ memAssets.files[id]={url:A[id].u,blob:null}; memAssets._urls.set(id,A[id].u); continue; }
    const bin=atob(A[id].d); const u8=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    const blob=new Blob([u8],{type:A[id].t});
    const url=URL.createObjectURL(blob);
    memAssets.files[id]={url,blob}; memAssets._urls.set(id,url);
  }
}

function setStatus(t){document.querySelectorAll('.savestat').forEach(e=>e.textContent=t);}
function save(){
  if(!db)return; dirty=true; setStatus('Guardando…');
  clearTimeout(saveT); saveT=setTimeout(()=>{saveT=null;flush();},700);
}
async function flush(){
  clearTimeout(saveT); saveT=null;
  if(!db)return true;
  while(saving) await new Promise(r=>setTimeout(r,120));
  if(!dirty)return true;
  dirty=false; saving=true; let ok=false;
  try{
    const data=JSON.parse(JSON.stringify(S));
    if(JSON.stringify(data).length>240000)throw {msg:'El texto de la página es demasiado largo para guardarse.'};
    if(ref){ await ref.set(data); try{await memoryStore.set(data);}catch(e){} }
    else { await memoryStore.set(data); }
    ok=true; setStatus('Guardado');
  }catch(e){
    dirty=true; setStatus('Sin guardar');
    let m=(e&&(e.msg||e.message))||'No se pudo guardar.';
    if(e&&e.code==='invalid_argument')m='No tienes permiso para guardar cambios en esta página.';
    toast(m,5000);
  }
  saving=false; return ok;
}
async function saveNow(){
  dirty=true; setStatus('Guardando…');
  const ok=await flush();
  if(ok)toast('Todo guardado ✓',2400);
  return ok;
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&dirty)flush();});
window.addEventListener('pagehide',()=>{if(dirty)flush();});

async function uploadMedia(files){

    try{

const palArr=c=>[c.bg,c.fg,c.accent,c.a2,c.ink];
const palObj=a=>({bg:a[0],fg:a[1],accent:a[2],a2:a[3],ink:a[4]});

  if(j&&typeof j.id==='string'){palState.id=j.id;if(j.custom&&PAL_FIELDS.every(f=>/^#[0-9a-f]{6}$/i.test(j.custom[f[0]]||'')))palState.custom=j.custom;}
}catch(e){}

function palVars(c){
  const m=(a,p,b)=>'color-mix(in srgb,'+a+' '+p+'%,'+b+')';
  return {'--bg':c.bg,'--fg':c.fg,'--accent':c.accent,'--a2':c.a2,'--ink':c.ink,'--line-strong':c.fg,
    '--panel':m(c.fg,6,c.bg),'--mute':m(c.fg,62,c.bg),'--line':m(c.fg,20,'transparent'),'--dot':m(c.fg,10,'transparent'),
    '--a3':m(c.accent,30,c.bg),'--hl':m(c.accent,30,c.bg),'--on-accent':lum(c.accent)>.55?'#0b0e16':'#ffffff'};
}
function palColors(id){
  if(id==='custom')return palState.custom;
  const p=PALETTES.find(x=>x.id===id)||PALETTES[0];
  return palObj(currentTheme()==='dark'?p.dark:p.light);
}
function applyPalette(){
  const root=document.documentElement;
  PAL_KEYS.forEach(k=>root.style.removeProperty(k));
  root.style.removeProperty('color-scheme');
  if(palState.id!=='default'){
    const c=palColors(palState.id),v=palVars(c);
    Object.keys(v).forEach(k=>root.style.setProperty(k,v[k]));
    root.style.setProperty('color-scheme',lum(c.bg)<.45?'dark':'light');
  }
  viewers.forEach(v=>v.refreshTheme());
}

function bgActiveFor(key){
  const g=S.bg&&S.bg.global, o=S.bg&&S.bg[key];
  if(o&&o.id) return o;
  if(g&&g.id) return g;
  return null;
}

function bgLayer(el,key){
  const cfg=bgActiveFor(key);
  if(!cfg)return;
  el.classList.add('has-bg');

  const imgEl=h('div',{class:'bgi'});
  const veilEl=h('div',{class:'bgv'});
  const layer=h('div',{class:'screen-bg','aria-hidden':'true'},imgEl,veilEl);

  const paint=()=>{
    imgEl.style.backgroundSize=cfg.fit==='contain'?'contain':cfg.fit==='auto'?'auto':'cover';
    const b=cfg.blur||0;
    imgEl.style.filter=b?'blur('+b+'px)':'none';
    imgEl.style.transform=b?'scale(1.12)':'none';
    veilEl.style.opacity=String(cfg.veil==null?.35:cfg.veil);
    layer.style.opacity=String(cfg.opacity==null?1:cfg.opacity);
  };
  paint();

  const apply=url=>{
    if(!url)return;
    imgEl.style.backgroundImage='url("'+url+'")';
    paint();
  };
  const now=assetURL(cfg.id);
  if(now && now.indexOf('blob:')===0)apply(now);
  if(assets&&assets.onReady)assets.onReady(cfg.id,apply);

  el.prepend(layer);
}

function render(keep){
  const y=window.scrollY;disposeViewers();mounts=[];
  let el;
  if(screen==='cover')el=coverScreen();
  else if(screen==='menu')el=menuScreen();
  else if(screen==='worlds')el=worldsScreen();
  else el=pageScreen();
  const bgKey = screen==='cover'?'cover':screen==='menu'?'menu':'page';
  if(el)try{bgLayer(el,bgKey);}catch(e){}
  $('#root').replaceChildren(el);
  if(screen==='page'||screen==='worlds'){const p=P(pageId);if(p)applyPageStyle(el,p);}
  const ms=mounts;mounts=[];ms.forEach(f=>f());
  if(keep)window.scrollTo(0,y);
}
function go(s,id){
  screen=s; if(id)pageId=id;
  if(s!=='page')currentWorldId=null;
  render();window.scrollTo(0,0);
}
function goWorld(wid,pid){
  if(pid)pageId=pid;
  currentWorldId=wid;
  screen='page';
  render();window.scrollTo(0,0);
}
async function toggleEdit(){if(SNAPSHOT||(!canEdit&&!editing))return;if(editing)await flush();editing=!editing;render(true);}

function quickCreateWorld(navigate){
  const p=P(pageId); if(!p)return;
  p.worlds=p.worlds||[];
  const n=p.worlds.length+1;
  const newWorld={id:uid(),name:'Mundo '+String(n).padStart(2,'0'),blocks:[],coverId:null};
  p.worlds.push(newWorld);
  save();
  toast('Mundo creado: '+newWorld.name,2400);
  if(navigate) goWorld(newWorld.id,p.id);
  else render(true);
}

function openGear(){
  if($('#gear-modal'))return;
  const overlay=h('div',{id:'gear-modal',class:'gmodal',role:'dialog','aria-modal':'true','aria-label':'Ajustes'});
  const panel=h('div',{class:'gpanel'});
  overlay.append(panel);
  overlay.addEventListener('click',e=>{ if(e.target===overlay)close(); });
  const esc=e=>{ if(e.key==='Escape')close(); };
  document.addEventListener('keydown',esc);
  function close(){ overlay.remove(); document.removeEventListener('keydown',esc); }

  const liveImg=()=>document.querySelector('.screen-bg .bgi');
  const liveVeil=()=>document.querySelector('.screen-bg .bgv');
  const liveLayer=()=>document.querySelector('.screen-bg');
  let cfgLive=null;
  const paintLive=()=>{
    const lay=liveLayer(); if(!lay)return;
    const im=liveImg(), ve=liveVeil();
    if(im){ im.style.backgroundSize=cfgLive.fit==='contain'?'contain':cfgLive.fit==='auto'?'auto':'cover'; }
    if(ve){ ve.style.opacity=String(cfgLive.veil==null?.35:cfgLive.veil); }
    if(im){ const b=cfgLive.blur||0; im.style.filter=b?'blur('+b+'px)':'none'; im.style.transform=b?'scale(1.12)':'none'; }
    lay.style.opacity=String(cfgLive.opacity==null?1:cfgLive.opacity);
  };

  function mkRange(label,val,min,max,step,fn){
    const r=h('input',{type:'range',min:String(min),max:String(max),step:String(step),value:String(val),'aria-label':label});
    r.addEventListener('input',()=>fn(parseFloat(r.value)));
    return h('label',{class:'fld'},h('span',{class:'mono'},label),r);
  }

  function bgControls(key,label){
    const cfg=S.bg[key]||(S.bg[key]={id:null,fit:'cover',opacity:1,blur:0,veil:.35});
    const thumb=h('div',{class:'bg-thumb'});
    const updateThumb=()=>{
      thumb.replaceChildren();
      if(cfg.id){
        const img=h('img',{alt:''});
        const now=assetURL(cfg.id);
        if(now && now.indexOf('blob:')===0)img.src=now;
        if(assets&&assets.onReady)assets.onReady(cfg.id,u=>{img.src=u;});
        thumb.append(img);
      }else{
        thumb.append(h('span',{class:'mono'},'—'));
      }
    };
    updateThumb();

    const upload=btn('Subir',async()=>{
      const f=(await pick('image/*,.gif,image/gif',false))[0];
      if(!f)return;
      try{
        toast('Subiendo fondo…',0);
        const r=await putAsset(f,{type:MT[ext(f)]||f.type||'image/png'});
        cfg.id=r.id;
        save();render(true);
        toast('Fondo aplicado',2000);
      }catch(e){toast(errText(e));}
    },'sm',label);

    const remove=cfg.id?btn('Quitar',()=>{
      dropAssets([cfg.id]);cfg.id=null;
      save();render(true);
    },'sm warn',label):null;

    const fitSel=sel([['cover','Cubrir'],['contain','Contener'],['auto','Original']],cfg.fit||'cover',v=>{
      cfg.fit=v;save(); if(cfgLive===cfg)paintLive();
    },'Ajuste');

    const opRange=mkRange('Opacidad',cfg.opacity==null?1:cfg.opacity,0,1,.05,v=>{cfg.opacity=v;save(); if(cfgLive===cfg)paintLive();});
    const blurRange=mkRange('Desenfoque',cfg.blur||0,0,24,1,v=>{cfg.blur=v;save(); if(cfgLive===cfg)paintLive();});
    const veilRange=mkRange('Oscurecer',cfg.veil==null?.35:cfg.veil,0,.9,.05,v=>{cfg.veil=v;save(); if(cfgLive===cfg)paintLive();});

    const row=h('div',{class:'bg-row'},
      thumb,
      h('div',{class:'bg-meta'},
        h('span',{class:'mono'},label),
        h('div',{class:'bg-actions'},upload,remove,fitSel),
        h('div',{class:'bg-sliders'},opRange,blurRange,veilRange)));

    row.addEventListener('pointerenter',()=>{cfgLive=cfg;});
    row.addEventListener('pointerdown',()=>{cfgLive=cfg;});
    return row;
  }

  function refresh(){
    panel.replaceChildren();
    panel.append(h('div',{class:'ghead'},
      h('h3',{class:'mono',style:{margin:0}},'⚙ Ajustes'),
      btn('Cerrar',close,'sm')));

    const curMode=document.documentElement.dataset.theme||'auto';
    const modeBtn=(m,label)=>{const b=btn(label,()=>{setThemeMode(m);refresh();},'sm'+(curMode===m?' pri':''),'Modo '+label);b.setAttribute('aria-pressed',String(curMode===m));return b;};
    const swatch=a=>h('div',{class:'pal-sw'},a.map(c=>h('i',{style:{background:c}})));
    const palCard=(id,name,colors)=>{
      const b=h('button',{type:'button',class:'pal',title:name,'aria-label':'Paleta '+name},swatch(colors.slice(0,4)),h('span',null,name));
      b.setAttribute('aria-pressed',String(palState.id===id));
      b.addEventListener('click',()=>{
        if(id==='custom'&&palState.id!=='custom'){
          const R=document.documentElement,g=n=>toHex(readRGB(R,n));
          palState.custom={bg:g('--bg'),fg:g('--fg'),accent:g('--accent'),a2:g('--a2'),ink:g('--ink')};
        }
        palState.id=id;savePal();applyPalette();refresh();
      });
      return b;
    };
    const dark=currentTheme()==='dark';
    const cards=PALETTES.map(p=>palCard(p.id,p.name,dark?p.dark:p.light));
    cards.push(palCard('custom','Personalizada',palArr(palState.custom)));
    const themeSec=h('section',{class:'panel'},
      h('h3',null,'Tema y colores'),
      h('div',{class:'fields'},
        h('span',{class:'mono'},'Modo'),
        modeBtn('auto','Auto'),modeBtn('light','Claro'),modeBtn('dark','Oscuro')),
      h('div',{class:'pal-grid',role:'group','aria-label':'Paletas de color'},cards));
    if(palState.id==='custom'){
      const fields=PAL_FIELDS.map(f=>{
        const i=h('input',{type:'color',value:palState.custom[f[0]],'aria-label':f[1]});
        i.addEventListener('input',()=>{palState.custom[f[0]]=i.value;savePal();applyPalette();});
        i.addEventListener('change',()=>refresh());
        return h('label',{class:'fld'},h('span',{class:'mono'},f[1]),i);
      });
      themeSec.append(h('div',{class:'pal-custom'},fields,
        btn('Volver al original',()=>{palState.id='default';savePal();applyPalette();refresh();},'sm','Volver a la paleta original')));
    }
    panel.append(themeSec);
    panel.append(h('section',{class:'panel'},
      h('h3',null,'Tamaño del contenido'),
      h('div',{class:'fields'},
        h('span',{class:'mono'},'Menú y hojas'),
        [['1','Normal'],['1.25','Grande'],['1.5','Muy grande']].map(o=>{
          const b=btn(o[1],()=>{setUiK(o[0]);refresh();},'sm'+(uiK===o[0]?' pri':''),'Tamaño '+o[1]);
          b.setAttribute('aria-pressed',String(uiK===o[0]));return b;
        }))));

    const sec=h('section',{class:'panel'},h('h3',null,'Fondos (imagen o GIF)'));
    sec.append(bgControls('global','Todos'));
    sec.append(bgControls('cover','Portada'));
    sec.append(bgControls('menu','Menú'));
    sec.append(bgControls('page','Hojas'));
    panel.append(sec);

    panel.append(h('p',{class:'mono',style:{color:'var(--mute)',margin:0}},
      'Cuando hay un fondo puesto en la Portada (o en "Todos"), el wireframe 3D se oculta y solo se ve la imagen/GIF.'));
  }

  refresh();
  document.body.append(overlay);
}

function starPath(n,ro,ri){
  let d='';
  for(let i=0;i<n*2;i++){const r=i%2?ri:ro,a=-Math.PI/2+i*Math.PI/n;d+=(i?'L':'M')+(50+r*Math.cos(a)).toFixed(1)+' '+(52+r*Math.sin(a)).toFixed(1);}
  return d+'Z';
}

function burst(box,cx,cy){
  if(REDUCE)return;
  const r=box.getBoundingClientRect(),cols=['var(--accent)','var(--a2)','var(--a3)','#ffffff'];
  for(let i=0;i<10;i++){
    const p=h('span',{class:'pt'});
    p.style.cssText='left:'+(cx-r.left)+'px;top:'+(cy-r.top)+'px;background:'+cols[i%4];
    box.append(p);
    const a=Math.random()*6.283,d=60+Math.random()*100;
    const an=p.animate([
      {transform:'translate(-50%,-50%) scale(1) rotate(0deg)',opacity:1},
      {transform:'translate(calc(-50% + '+Math.cos(a)*d+'px),calc(-50% + '+Math.sin(a)*d+'px)) scale(.2) rotate(240deg)',opacity:0}
    ],{duration:650+Math.random()*250,easing:'cubic-bezier(.15,.8,.3,1)'});
    an.onfinish=()=>p.remove();
  }
}
function pop(w,box){
  w.classList.remove('pop');void w.offsetWidth;w.classList.add('pop');
  const r=w.getBoundingClientRect();burst(box,r.left+r.width/2,r.top+r.height/2);
}
function dragSticker(w,box){
  let id=null,sx=0,sy=0,ox=0,oy=0,moved=false;
  w.addEventListener('pointerdown',e=>{
    e.preventDefault();id=e.pointerId;w.setPointerCapture(id);
    sx=e.clientX;sy=e.clientY;ox=parseFloat(w.style.left);oy=parseFloat(w.style.top);moved=false;w.classList.add('drag');
  });
  w.addEventListener('pointermove',e=>{
    if(id!==e.pointerId)return;
    const r=box.getBoundingClientRect(),dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>5)moved=true;
    if(moved){w.style.left=Math.min(98,Math.max(2,ox+dx/r.width*100))+'%';w.style.top=Math.min(98,Math.max(2,oy+dy/r.height*100))+'%';}
  });
  const end=e=>{if(id!==e.pointerId)return;id=null;w.classList.remove('drag');if(!moved&&e.type==='pointerup')pop(w,box);};
  w.addEventListener('pointerup',end);w.addEventListener('pointercancel',end);
}

function stickerScope(){
  if(screen==='menu') return {kind:'menu'};
  if(screen==='page' || screen==='worlds'){
    if(currentWorldId) return {kind:'world', id:currentWorldId};
    if(pageId) return {kind:'page', id:pageId};
  }
  return null;
}
function getStickerList(create){
  if(!S.stickers) S.stickers={menu:[],pages:{},worlds:{}};
  const k=stickerScope();
  if(!k) return null;
  if(k.kind==='menu'){
    if(!Array.isArray(S.stickers.menu)) S.stickers.menu=[];
    return S.stickers.menu;
  }
  const bag = k.kind==='page' ? S.stickers.pages : S.stickers.worlds;
  if(!bag[k.id]){
    if(!create) return null;
    bag[k.id]=[];
  }
  return bag[k.id];
}

function attachStickerDrag(el,st,layer,editing){
  if(!editing && st.interactive===false){
    el.style.pointerEvents='none';
    return;
  }
  let pid=null,sx=0,sy=0,ox=0,oy=0,moved=false;
  const down=e=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    e.preventDefault();
    pid=e.pointerId;
    try{el.setPointerCapture(pid);}catch(err){}
    sx=e.clientX; sy=e.clientY; ox=st.x; oy=st.y; moved=false;
    el.classList.add('drag');
  };
  const move=e=>{
    if(pid!==e.pointerId) return;
    const r=layer.getBoundingClientRect();
    if(!r.width||!r.height) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>5) moved=true;
    if(moved){
      st.x=Math.min(98,Math.max(2,ox+dx/r.width*100));
      st.y=Math.min(98,Math.max(2,oy+dy/r.height*100));
      el.style.left=st.x+'%';
      el.style.top=st.y+'%';
    }
  };
  const end=e=>{
    if(pid!==e.pointerId) return;
    pid=null;
    el.classList.remove('drag');
    try{el.releasePointerCapture(e.pointerId);}catch(err){}
    if(moved){ save(); }
    else if(!editing && e.type==='pointerup'){ pop(el,layer); }
  };
  el.addEventListener('pointerdown',down);
  el.addEventListener('pointermove',move);
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
}
function attachStickerLayer(host,editing){
  const list=getStickerList(false);
  if(!list || !list.length) return;
  const layer=h('div',{class:'stk-layer','aria-hidden':'true'});
  host.append(layer);

    if(st.hidden && !editing) return;
    const el=buildStickerEl(st,i);
    if(editing){
      el.classList.add('stk-editing');
      if(st.hidden) el.classList.add('stk-hidden-edit');
    }
    layer.append(el);
    attachStickerDrag(el,st,layer,editing);
  });
}

function coverItem(cfg,label,content){
  if(cfg.hidden){
    if(!editing) return null;
    return h('div',{class:'cv-ghost'},
      h('span',{class:'mono'},'▸ '+label+' oculto'),
      btn('Mostrar',()=>{cfg.hidden=false;save();render(true);},'sm','Mostrar'));
  }
  const w=h('div',{class:'cv-item'});
  w.append(content);

  const apply=()=>{
    const dx=cfg.dx||0, dy=cfg.dy||0, sc=cfg.s||1;
    w.style.transform=(dx||dy||sc!==1)?'translate('+dx+'px,'+dy+'px) scale('+sc+')':'';
  };
  apply();

  if(editing){
    w.classList.add('cv-edit');
    const del=h('button',{type:'button',class:'cv-btn cv-del','aria-label':'Ocultar','title':'Ocultar',onclick:e=>{e.preventDefault();e.stopPropagation();cfg.hidden=true;save();render(true);}},'×');
    const rst=h('button',{type:'button',class:'cv-btn cv-rst','aria-label':'Volver al centro','title':'Volver al centro',onclick:e=>{e.preventDefault();e.stopPropagation();cfg.dx=0;cfg.dy=0;cfg.s=1;save();render(true);}},'⌖');
    const mv=h('button',{type:'button',class:'cv-btn cv-mv','aria-label':'Mover (arrastra)','title':'Arrastra para mover'},'✥');
    const size=d=>e=>{e.preventDefault();e.stopPropagation();cfg.s=Math.min(3,Math.max(.4,Math.round(((cfg.s||1)+d)*100)/100));apply();save();};
    const szm=h('button',{type:'button',class:'cv-btn cv-sz cv-szm','aria-label':'Más pequeño','title':'Más pequeño',onclick:size(-.1)},'−');
    const szp=h('button',{type:'button',class:'cv-btn cv-sz cv-szp','aria-label':'Más grande','title':'Más grande',onclick:size(.1)},'+');
    w.append(del,rst,mv,szm,szp);

    let drag=false,sx=0,sy=0,sdx=0,sdy=0,moved=false,pid=null;
    w.addEventListener('pointerdown',e=>{
      if(e.target===del||e.target===rst||e.target===szm||e.target===szp)return;
      if(e.target.closest('[contenteditable="true"]'))return;
      if(e.pointerType==='mouse'&&e.button!==0)return;
      drag=true;sx=e.clientX;sy=e.clientY;sdx=cfg.dx||0;sdy=cfg.dy||0;moved=false;pid=e.pointerId;
      try{w.setPointerCapture(pid);}catch(err){}
      w.classList.add('dragging');
    });
    w.addEventListener('pointermove',e=>{
      if(!drag||e.pointerId!==pid)return;
      const dx=e.clientX-sx, dy=e.clientY-sy;
      if(Math.abs(dx)+Math.abs(dy)>3)moved=true;
      if(moved){cfg.dx=sdx+dx;cfg.dy=sdy+dy;apply();}
    });
    const end=e=>{
      if(!drag)return;
      if(e&&pid!=null&&e.pointerId!==pid)return;
      drag=false;w.classList.remove('dragging');
      try{if(pid!=null)w.releasePointerCapture(pid);}catch(err){}
      if(moved)save();
    };
    w.addEventListener('pointerup',end);
    w.addEventListener('pointercancel',end);
  }
  return w;
}

  if(yt){
    box.append(h('img',{alt:'',src:'https://img.youtube.com/vi/'+yt.vid+'/hqdefault.jpg',loading:'lazy'}));
    return box;
  }

  const model=(container.blocks||[]).find(b=>b.type==='model');
  if(!model){
    box.append(h('span',{class:'mono'},'Sin vista previa'));
    return box;
  }
  if(viewerReady()){
    box.append(h('span',{class:'mono'},'Modelo 3D'));
    return box;
  }

  const stage=h('div',{class:'world-3d'});
  box.append(stage);

  mounts.push(async()=>{
    let started=false;
    const start=async()=>{
      if(started)return; started=true;
      let v=null;
      try{
        v=new Viewer(stage,{
          auto:!REDUCE,
          speed:1.2,
          interactive:false,
          mode:model.mode||'textured'
        });
      }catch(e){ return; }
      viewers.push(v);
      try{
        const m=await loadModel(model);
        if(v.disposed)return;
        v.setModel(m);
        if(model.mats && Object.keys(model.mats).length) v.applyMaterialState(model.mats);
        v.setLighting(model.lightMode||'basic');
      }catch(e){}
    };
    const io=new IntersectionObserver(entries=>{
      if(entries[0].isIntersecting) start();
    },{rootMargin:'200px'});
    io.observe(stage);
  });

  return box;
}

    colorIn.addEventListener('input',()=>{cfg.baseColor=colorIn.value;save();applyAll();});

    const numF=(label,key,min,max,step)=>h('label',{class:'fld'},h('span',{class:'mono'},label),
      h('input',{type:'range',min,max,step,value:cfg[key],oninput:e=>{cfg[key]=parseFloat(e.target.value);save();applyAll();}}));

    editor=h('div',{class:'tex-editor'},
      h('div',{class:'tex-editor-head mono'},mat.name),
      h('div',{class:'fields'},
        h('label',{class:'fld'},h('span',{class:'mono'},'Color base'),colorIn),
        numF('Roughness','roughness',0,1,.01),
        numF('Metallic','metalness',0,1,.01),
        numF('Normal intensity','normalScale',0,3,.05),
        numF('Repetición X','repeatX',.1,10,.1),
        numF('Repetición Y','repeatY',.1,10,.1),
        numF('Rotación (°)','rotation',-180,180,1)),
      h('div',{class:'tex-slots'},slotRows));
    texPanel.append(editor);
  }

  function applyAll(){if(!v||!v.ready)return;v.applyMaterialState(matState);}

  mounts.push(async()=>{
    const bad=viewerReady();if(bad){showMsg(bad);return;}
    if(b.mid!=='demo' && assets && assets._load){
      showMsg('Cargando modelo desde el almacén…');
      const u=await assets._load(b.mid);
      if(!u){ showMsg('No se encontró el modelo guardado. Vuelve a subirlo.'); return; }
    }
    try{v=new Viewer(stage,{auto:b.rotate!==false&&!REDUCE,speed:SPEEDS[b.speed||'n'],mode:b.mode||'textured'});}catch(e){showMsg('No se pudo iniciar el visor 3D.');return;}
    viewers.push(v);v.onAngle=a=>{az.textContent='AZ '+pad(a)+'°';};
    try{
      const m=await loadModel(b);if(v.disposed)return;v.setModel(m);showMsg('');
      if(v.actions.length){
        m.animations.forEach((a,k)=>animSel.append(h('option',{value:k},a.name||('Animación '+(k+1)))));
        playB.hidden=false;animSel.hidden=v.actions.length<2;
      }
      applyAll();
      refreshMaterialList();
      if(texPanel&&v.getMaterials().length){
        selectedMatId=v.getMaterials()[0].id;
        refreshMaterialList();
        refreshMatEditor();
      }
      if(b.lightMode)v.setLighting(b.lightMode);
    }catch(e){console.error(e);if(!v.disposed)showMsg((e&&e.msg)||'No se pudo abrir este modelo.');}
  });

  const cap=(editing||b.cap)?ed('p','mv-cap mono',b.cap,t=>{b.cap=t;save();},editing,'Descripción del modelo'):null;

  let inner;
  if(editing&&texPanel){
    inner=h('div',{class:'tex-workspace'},
      h('aside',{class:'tex-side'},texPanel),
      h('div',{class:'tex-main'},host,cap));
  }else{
    inner=h('div',null,host,cap);
  }

  if(!editing)return inner;
  const tools=[
    btn('Reemplazar modelo',async()=>{
      const f=(await pick(MODEL_ACCEPT,false))[0];if(!f)return;
      try{const r=await prepModel(f);dropAssets([b.mid]);b.mid=r.mid;b.ext=r.ext;b.name=r.name;b.mats={};selectedMatId=null;save();render(true);}catch(e){toast(errText(e),5000);}
    },'sm','Subir otro modelo'),
    sel([['textured','Inicia con texturas'],['base','Inicia en base'],['wire','Inicia en wireframe'],['quads','Inicia en quads'],['normals','Inicia en normales'],['rig','Inicia en rig']],b.mode||'textured',x=>{b.mode=x;save();},'Vista inicial'),
    sel(LIGHT_MODES,b.lightMode||'basic',x=>{b.lightMode=x;if(v)v.setLighting(x);save();},'Iluminación'),
    sel([['l','Giro lento'],['n','Giro normal'],['f','Giro rápido']],b.speed||'n',x=>{b.speed=x;if(v)v.controls.autoRotateSpeed=SPEEDS[x];save();},'Velocidad'),
    sel([['1','Gira solo'],['0','Quieto al inicio']],b.rotate===false?'0':'1',x=>{b.rotate=x==='1';if(v){v.setAuto(b.rotate);autoB.setAttribute('aria-pressed',String(b.rotate));}save();},'Giro automático'),
    h('span',{class:'mono',style:{color:'var(--mute)'}},b.mid==='demo'?'Ejemplo':b.name)
  ];
  return frame(p,b,i,'Modelo 3D',tools,inner);
}

function spacerBlock(p,b,i){
  const px=()=>({s:24,m:64,l:120}[b.size||'m']);
  const el=h('div',{class:'sp'+(b.line?' line':''),role:'separator'});
  const ap=()=>{el.className='sp'+(b.line?' line':'');el.style.height=px()+'px';el.style.setProperty('--sp',px()/2+'px');};ap();
  if(!editing)return el;
  const tools=[
    sel([['s','Espacio chico'],['m','Espacio medio'],['l','Espacio grande']],b.size||'m',x=>{b.size=x;ap();save();},'Tamaño'),
    sel([['0','Sin línea'],['1','Con línea']],b.line?'1':'0',x=>{b.line=x==='1';ap();save();},'Línea')
  ];
  return frame(p,b,i,'Espacio',tools,h('div',{style:{minHeight:'24px'}},el));
}

function openYtPrompt(cb){
  if($('#yt-prompt')) return;
  const ov=h('div',{id:'yt-prompt',class:'gmodal',role:'dialog','aria-modal':'true','aria-label':'Agregar video de YouTube'});
  const inp=h('input',{type:'text',placeholder:'https://youtube.com/watch?v=…  ·  youtu.be/…',value:'','aria-label':'Enlace de YouTube'});
  inp.style.cssText='width:100%;font:500 14px var(--f-mono);padding:.7em .8em;border:2px solid var(--line-strong);background:var(--bg);color:var(--fg)';
  const err=h('p',{class:'mono',hidden:true,style:{color:'var(--warn)',margin:0,textTransform:'none'}},'');
  const okBtn=btn('Agregar',commit,'pri','Agregar video');
  const cancelBtn=btn('Cancelar',()=>close(),'sm','Cancelar');
  function commit(){
    const v=inp.value.trim();
    if(!v){ inp.focus(); return; }
    if(!ytId(v)){ err.textContent='Ese enlace no es válido. Prueba con: https://www.youtube.com/watch?v=XXXXXXXXXXX'; err.hidden=false; inp.focus(); inp.select(); return; }
    close(); cb(v);
  }
  const panel=h('div',{class:'gpanel'},
    h('div',{class:'ghead'},h('h3',{class:'mono',style:{margin:0}},'▶ YouTube'),cancelBtn),
    h('p',{class:'mono',style:{color:'var(--mute)',margin:0,textTransform:'none',lineHeight:'1.45'}},'Pega el enlace del video. Acepta watch, youtu.be, shorts, embed o el ID de 11 caracteres.'),
    inp,
    err,
    h('div',{style:{display:'flex',gap:'8px',justifyContent:'flex-end',flexWrap:'wrap'}},okBtn)
  );
  ov.append(panel);
  ov.addEventListener('click',e=>{if(e.target===ov)close();});
  const esc=e=>{if(e.key==='Escape')close();};
  document.addEventListener('keydown',esc);
  function close(){ov.remove();document.removeEventListener('keydown',esc);}
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commit();}});
  document.body.append(ov);
  setTimeout(()=>inp.focus(),30);
}

function addBar(p){
  const add=(b)=>{p.blocks.push(b);save();render(true);requestAnimationFrame(()=>{const f=document.querySelectorAll('.bframe');if(f.length)f[f.length-1].scrollIntoView({behavior:REDUCE?'auto':'smooth',block:'center'});});};
  const isWorld=!!currentWorldId;
  return h('div',{class:'adder',role:'group','aria-label':'Agregar bloque'},
    h('span',{class:'mono'},'Agregar'),
    btn('Título',()=>add(B.h('')),'sm'),
    btn('Texto',()=>add(B.p('')),'sm'),
    btn('Imagen / GIF',async()=>{const f=await pick('image/*,.gif,.webp,.svg',true);if(!f.length)return;const it=await uploadMedia(f);if(it.length)add(B.media(it,1,it.length===1));},'sm'),
    btn('Video',async()=>{const f=await pick('video/mp4,video/webm,.mp4,.webm',true);if(!f.length)return;const it=await uploadMedia(f);if(it.length)add(B.media(it,1));},'sm'),
    btn('YouTube',()=>{ openYtPrompt((url)=>{ add(B.youtube(url)); }); },'sm','Agregar un video de YouTube por enlace'),
    btn('Modelo 3D',async()=>{
      const f=(await pick(MODEL_ACCEPT,false))[0];if(!f)return;
      try{const r=await prepModel(f);add(B.model(r.mid,r.ext,r.name));}catch(e){toast(errText(e),5000);}
    },'sm'),
    btn('Espacio',()=>add(B.sp()),'sm'),
    !isWorld?btn('+ Mundo',()=>quickCreateWorld(true),'sm pri','Crear un mundo nuevo'):null);
}

function pageScreen(){
  const p=P(pageId);if(!p){screen='menu';return menuScreen();}
  const w=currentWorldId?(p.worlds||[]).find(x=>x.id===currentWorldId):null;
  if(currentWorldId && !w){ currentWorldId=null; screen='worlds'; return worldsScreen(); }
  const container = w || p;
  const ids=pageAssets(container);
  { const had=ids.map(id=>memAssets._urls.has(id));
    Promise.all(ids.map(id=>memAssets._load(id))).then(urls=>{
      if(urls.some((u,i)=>!!u && !had[i])) render(true);
    }); }
  const i=S.pages.indexOf(p),prev=S.pages[i-1],next=S.pages[i+1];
  const scr=h('div',{class:'screen'});
  const blocks=container.blocks.map((b,k)=>b.type==='h'||b.type==='p'?textBlock(container,b,k):b.type==='media'?mediaBlock(container,b,k):b.type==='model'?modelBlock(container,b,k):b.type==='youtube'?youtubeBlock(container,b,k):b.type==='sp'?spacerBlock(container,b,k):null);

  const backBtn = w ? btn('←  Mundos',()=>go('worlds',p.id)) : btn('←  Menú',()=>go('menu'));
  const title = w ? w.name : p.title;
  const onTitle = v => { if(w) w.name=v; else p.title=v; save(); };
  const subtitle = w ? ('Mundo · '+p.title) : ('Hoja '+(i+1)+' de '+S.pages.length);
  const mundosBtn = !w ? btn('Mundos',()=>go('worlds',p.id),'sm','Ver mundos de esta hoja') : null;

  scr.append(
    h('div',{class:'topbar gut'},backBtn,
      h('div',{class:'crumb'},
        ed('span','crumb-t',title,onTitle,editing,w?'Nombre del mundo':'Nombre de la hoja',true),
        h('small',{class:'mono'},subtitle)),
      mundosBtn,
      barRight()),
    h('main',{class:'page-body gut'},
      editing&&w?worldCoverPanel(w):null,
      editing?stylePanel(p,scr):null,
      editing?stickersPanel():null,
      blocks,
      editing&&!container.blocks.length?h('div',{class:'drop'},h('span',{class:'mono'},'Esta '+(w?'escena':'hoja')+' está vacía. Usa la barra de abajo para agregar contenido.')):null,
      editing?addBar(container):null,
      h('nav',{class:'pnav','aria-label':'Navegación'},
        w ? btn('←  Volver a Mundos',()=>go('worlds',p.id)) : (prev?btn('←  '+(prev.title||'Anterior'),()=>go('page',prev.id)):h('span')),
        w ? btn('Menú principal',()=>go('menu')) : (next?btn((next.title||'Siguiente')+'  →',()=>go('page',next.id)):btn('Volver al menú',()=>go('menu'))))));
  attachStickerLayer(scr, editing);
  return scr;
}

function onSnap(snap){
  if(snap.metadata&&snap.metadata.hasPendingWrites)return;
  if(editing&&loaded)return;
  if(snap.exists)S=normalize(snap.data());
  if(screen==='page'&&!P(pageId))screen='menu';
  if(currentWorldId){const p=P(pageId);if(!p||!(p.worlds||[]).some(x=>x.id===currentWorldId))currentWorldId=null;}
  loaded=true;render(true);
}
async function init(){
  if(SNAPSHOT){
    S=normalize(SNAPSHOT.state); assets=memAssets; db=null; ref=null; canEdit=false; editing=false;
    try{ await loadSnapshot(); }catch(e){ console.warn(e); }
    loaded=true; render(); return;
  }
  let local=null;
  try{ local=await memoryStore.get(); if(local)S=normalize(local); }catch(e){}
  let usr=null;
  if(window.claude&&window.claude.use){
    try{db=await window.claude.use('db');}catch(e){db=null;}
    try{assets=await window.claude.use('assets');}catch(e){assets=null;}
    try{usr=await window.claude.use('user');}catch(e){usr=null;}
  }
  if(db){ ref=db.doc('portfolio/main'); } else { db=memoryStore; ref=null; }
  if(!assets){assets=memAssets;}
  canEdit=true;
  if(usr&&usr.can){ try{ if((await usr.can('data.write'))===false)canEdit=false; }catch(e){} }
  let needSeed=false;
  if(ref){
    try{
      const snap=await ref.get();
      if(snap.exists)S=normalize(snap.data());
      else needSeed=true;
    }catch(e){}
  }
  loaded=true;
  render();
  if(ref){
    try{ref.onSnapshot(onSnap,()=>{});}catch(e){}
    if(needSeed&&canEdit)save();
  }
}
init();
})();

</script></body></html>
